spring.application.name=arenahub-backend
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itstornei}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.security.jwt.secret-base64=${JWT_SECRET_BASE64}
app.security.jwt.token-minutes=120
